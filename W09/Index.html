<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Book</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Recipe Book">
  <meta property="og:description" content="Delicious, easy-to-follow recipes for everyday cooking.">
  <meta property="og:url" content="https://grace974.github.io/wdd131/W09/Index.html">
  <meta property="og:image" content="images/social-preview-image.png">

  <!-- X (Twitter) Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Recipe Book">
  <meta name="twitter:description" content="Delicious, easy-to-follow recipes for everyday cooking.">
  <meta name="twitter:image" content="images/social-preview-image.png">

  <!-- Icons -->
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Google Font: Amatic SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <!-- Flexbox Row 1: Logo + Title -->
    <div class="logo-title">
      <img src="images/recipe-book.png" alt="Recipe Book Logo">
      <h1>RecipeBook</h1>
    </div>

    <!-- Flexbox Row 2: Search Form -->
    <form class="search-form" action="#" method="get">
      <input type="text" placeholder="Find a recipe" aria-label="Find a recipe">
      <button type="submit" aria-label="Search">
        <img src="images/search.svg" alt="Search icon">
      </button>
    </form>
  </header>

  <main>
    <!-- Flexbox Container for the Recipe Card -->
    <article class="recipe-card">
      <img class="recipe-img" src="images/apple-crisp.jpg" alt="Warm apple crisp topped with vanilla ice cream">
      
      <div class="recipe-details">
        <ul class="recipe-tags">
          <li>dessert</li>
        </ul>

        <h2><a href="#">Apple Crisp</a></h2>

        <!-- Accessible Star Rating -->
        <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>

        <!-- Hidden on mobile, visible on larger screens -->
        <p class="recipe-description">
          This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
        </p>
      </div>
    </article>
  </main>

  <footer>
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
    <a class="attribution" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
      Recipe icons created by Freepik - Flaticon
    </a>
  </footer>
</body>
</html>
