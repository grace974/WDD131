<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Read For Fun</title>
    <link rel="stylesheet" href="blog.css">
</head>
<body>

    <header class="site-header">
        <h1>Kids Read For Fun</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#archive">Archive</a></li>
                <li><a href="#search">Search</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <article class="book-review">
            
            <!-- Metadata Section: Appears on top for mobile[cite: 1], left column for desktop[cite: 2] -->
            <section class="meta-section" aria-label="Review Metadata">
                <p class="date"><time datetime="2022-07-05">July 5, 2022</time></p>
                <p class="age-group"><span class="visually-hidden">Age group: </span>10-14</p>
                <p class="genre"><span class="visually-hidden">Genre: </span>Fantasy</p>
                <p class="rating" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true">⭐⭐⭐⭐</span>
                </p>
            </section>

            <!-- Book Information Section -->
            <section class="details-section" aria-label="Book Details">
                <h2 class="book-title">Septimus Heap Book One: Magyk</h2>
                <figure class="book-cover">
                    <img src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg" alt="Book cover of Septimus Heap Book One: Magyk by Angie Sage">
                </figure>
                <p class="book-description">
                    If you enjoy stories about seventh sons of seventh sons and magyk this is the book for you.
                </p>
            </section>

        </article>
    </main>

    <footer class="site-footer">
        <p>Jane Doe</p>
    </footer>

</body>
</html>
