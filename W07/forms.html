<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Playground</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <form>
        <label for="ssn"> Enter your Social Security number</label>
        <input type="text" id="ssn" placeholder="111-11-1111" name="ssn" required max="9"><br><br><br><br>

        <label for="search">Search Bar:</label>
        <input type="search"name="search" id="search"><br><br><br><br>

        <label for="password">Password:</label>
        <input type="password"name="password"id="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters"><br><br><br><br>

        <label for="telephone">Phone Number</label>
        <input type="tel"name="telephone number" id="telephone" placeholder="111-111-1111" required max="10"><br><br><br><br>

        <label for="color">Color:</label>
        <input type="color" name="color" id="color" ><br><br><br><br>

        <input type="file"name="file" id="file" ><br><br><br><br>

        <input type="submit" value="submit"><br><br><br><br>
    </form>
</body>
</html>
